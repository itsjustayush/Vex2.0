<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vex Workspace | Authentication</title>

    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <!-- Theme Pre-Init Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('vex_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            }
        })();
    </script>

    <style>
        :root {
            --background: #f8fafc;
            --surface-low: #ffffff;
            --surface-high: #f1f5f9;
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --on-surface: #0f172a;
            --slate-border: #e2e8f0;
            --slate-text: #64748b;
        }

        html.dark {
            --background: #131316;
            --surface-low: #1b1b1e;
            --surface-high: #2a2a2d;
            --primary: #63dac3;
            --primary-hover: #42cbb1;
            --on-surface: #e4e1e6;
            --slate-border: #27272A;
            --slate-text: #8e8e93;
        }
    </style>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "var(--background)",
                        "surface-low": "var(--surface-low)",
                        "surface-high": "var(--surface-high)",
                        "primary": "var(--primary)",
                        "primary-hover": "var(--primary-hover)",
                        "on-surface": "var(--on-surface)",
                        "slate-border": "var(--slate-border)",
                        "slate-text": "var(--slate-text)"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <!-- Firebase Web SDK (v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <!-- Google Identity Services & Workspace Module -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/static/js/google-services.js"></script>
</head>
<body class="bg-background text-on-surface h-full flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-surface-low border border-slate-border rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Subtle Glow Background Accent -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-primary/10 rounded-full blur-2xl"></div>

        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary/20 border border-primary/30 text-primary mb-3">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-on-surface">
                Vex Workspace <span class="text-primary font-mono text-base font-normal ml-1"><span id="typewriter-text">Think Better</span><span class="animate-pulse font-bold">|</span></span>
            </h1>
            <p class="text-xs text-slate-text mt-1">AI-Powered Networked Note Engine & Workspace</p>
        </div>

        <!-- Authentication Card -->
        <div class="space-y-4">
            <div id="auth-error-box" class="hidden p-4 rounded-xl bg-surface-low border border-slate-border text-xs font-medium space-y-2"></div>

            <!-- Google Sign-In Button -->
            <button id="btn-google-login" onclick="loginWithGoogle()" class="w-full bg-surface-high border border-slate-border hover:border-primary/50 text-on-surface font-semibold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-3 shadow-sm group">
                <svg class="w-5 h-5 group-hover:scale-105 transition-transform" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <div class="mt-8 text-center border-t border-slate-border/50 pt-4">
            <p class="text-[11px] text-slate-text">
                By signing in, you agree to Vex Workspace <a href="/docs" class="text-primary underline">Terms & Privacy</a>.
            </p>
        </div>
    </div>

    <script>
        // Inject Firebase Configuration passed from Flask server or window defaults
        const firebaseConfig = {{ firebase_json | safe if firebase_json else '{}' }};
        
        let auth = null;
        if (firebaseConfig && firebaseConfig.apiKey) {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
            } catch (e) {
                console.warn('Firebase initialization notice:', e);
            }
        }

        // Check if already authenticated or returning from redirect
        if (auth) {
            auth.getRedirectResult().then((result) => {
                if (result && result.user) {
                    window.location.href = '/dashboard';
                }
            }).catch((error) => {
                console.error('Redirect sign-in error:', error);
                showAuthError(error);
            });

            auth.onAuthStateChanged((user) => {
                if (user) {
                    window.location.href = '/dashboard';
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function showAuthError(error) {
            const errBox = document.getElementById('auth-error-box');
            const host = window.location.hostname;
            const errStr = typeof error === 'string' ? error : (error && error.message ? error.message : '');
            const errCode = error && error.code ? error.code : '';
            const isUnauthorizedDomain = errCode === 'auth/unauthorized-domain' || errStr.includes('unauthorized-domain');
            const isNetworkError = errCode === 'auth/network-request-failed' || errStr.includes('network-request-failed');

            if (isUnauthorizedDomain) {
                errBox.innerHTML = `
                    <div class="flex items-start gap-2.5 text-amber-400">
                        <span class="material-symbols-outlined text-lg flex-shrink-0 mt-0.5">warning</span>
                        <div class="space-y-1.5 text-left w-full">
                            <p class="font-bold text-xs text-amber-300">Firebase: Domain Not Authorized</p>
                            <p class="text-[11px] text-slate-300 leading-relaxed">
                                The current domain (<span class="font-mono text-primary font-semibold select-all">${escapeHtml(host)}</span>) is not authorized in your Firebase authentication settings.
                            </p>
                            <div class="bg-surface-high border border-slate-border/80 rounded-lg p-3 space-y-2 text-[11px]">
                                <p class="font-semibold text-on-surface">To authorize this domain:</p>
                                <ol class="list-decimal list-inside text-slate-text space-y-1 leading-normal">
                                    <li>Go to <a href="https://console.firebase.google.com/" target="_blank" class="text-primary underline font-medium">Firebase Console</a></li>
                                    <li>Select your project &rarr; <strong>Authentication</strong> &rarr; <strong>Settings</strong> &rarr; <strong>Authorized domains</strong></li>
                                    <li>Click <strong>Add domain</strong> and add:</li>
                                </ol>
                                <div class="flex items-center justify-between bg-surface-low border border-slate-border px-2.5 py-1.5 rounded font-mono text-[11px] text-primary">
                                    <span class="select-all font-semibold">${escapeHtml(host)}</span>
                                    <button onclick="navigator.clipboard.writeText('${escapeHtml(host)}'); alert('Domain copied to clipboard!');" class="text-[10px] bg-primary/20 text-primary px-2 py-0.5 rounded border border-primary/30 hover:bg-primary/30 font-sans transition-all">Copy Domain</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (isNetworkError) {
                errBox.innerHTML = `
                    <div class="flex items-start gap-2.5 text-amber-400">
                        <span class="material-symbols-outlined text-lg flex-shrink-0 mt-0.5">wifi_off</span>
                        <div class="space-y-1.5 text-left w-full">
                            <p class="font-bold text-xs text-amber-300">Authentication Network Error</p>
                            <p class="text-[11px] text-slate-300 leading-relaxed">
                                Google popup auth failed due to network or iframe cross-origin restriction. Try redirect sign-in or open in a direct tab.
                            </p>
                            <div class="flex flex-wrap gap-2 pt-1">
                                <button onclick="loginWithGoogle(true)" class="bg-primary text-surface-dark font-semibold text-[11px] px-3 py-1.5 rounded-lg hover:bg-primary-hover transition-all">
                                    Sign In with Redirect
                                </button>
                                <a href="${window.location.href}" target="_blank" class="bg-surface-high border border-slate-border text-on-surface font-semibold text-[11px] px-3 py-1.5 rounded-lg hover:border-primary/50 transition-all inline-flex items-center gap-1">
                                    Open in New Tab <span class="material-symbols-outlined text-xs">open_in_new</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                errBox.innerHTML = `<p class="text-xs text-red-400 text-center font-medium">${escapeHtml(errStr || 'Google Sign-In failed. Please try again.')}</p>`;
            }
            errBox.classList.remove('hidden');
        }

        async function loginWithGoogle(useRedirect = false) {
            localStorage.removeItem('vex_demo_mode');
            
            if (!auth) {
                showAuthError("Firebase Authentication configuration is missing or inactive. Please configure Firebase API keys.");
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('email');
            provider.addScope('profile');
            
            if (useRedirect) {
                try {
                    await auth.signInWithRedirect(provider);
                } catch (error) {
                    console.error('Redirect Sign-In Error:', error);
                    showAuthError(error);
                }
                return;
            }

            try {
                const result = await auth.signInWithPopup(provider);
                if (window.GoogleWorkspaceService && result) {
                    window.GoogleWorkspaceService.handleFirebaseUserCredential(result);
                }
                window.location.href = '/dashboard';
            } catch (error) {
                console.error('Google Sign-In Error:', error);
                const errCode = error && error.code ? error.code : '';
                if (errCode === 'auth/network-request-failed' || errCode === 'auth/popup-blocked') {
                    console.warn('Popup blocked/network error, attempting redirect sign-in...');
                    try {
                        await auth.signInWithRedirect(provider);
                        return;
                    } catch (redirectErr) {
                        console.error('Redirect fallback error:', redirectErr);
                    }
                }
                showAuthError(error);
            }
        }

        // Typewriter Animation
        window.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('typewriter-text');
            if (!el) return;

            const phrases = ["Think Better", "Do Better", "Work Better", "Write Better", "Plan better"];
            let phraseIdx = 0;
            let charIdx = phrases[0].length;
            let isDeleting = false;

            function tick() {
                const current = phrases[phraseIdx];
                if (isDeleting) {
                    charIdx--;
                } else {
                    charIdx++;
                }

                el.textContent = current.substring(0, charIdx);

                let delta = isDeleting ? 40 : 80;

                if (!isDeleting && charIdx === current.length) {
                    delta = 2200;
                    isDeleting = true;
                } else if (isDeleting && charIdx === 0) {
                    isDeleting = false;
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    delta = 400;
                }

                setTimeout(tick, delta);
            }

            setTimeout(tick, 1000);
        });
    </script>
</body>
</html>
