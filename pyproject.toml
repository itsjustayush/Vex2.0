[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-workspace"
version = "1.0.0"
description = "Vex Workspace - AI-powered note-taking application & developer platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "firebase-admin>=6.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "google-generativeai>=0.8.0",
    "PyJWT>=2.8.0"
]
